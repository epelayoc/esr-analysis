[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esr_package"
version = "0.1.0"
description = "Pipeline para procesamiento y anonimización de archivos ESR"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=3.0.0",
    "pandas>=2.0.0",
    "cryptography>=41.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=12.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
